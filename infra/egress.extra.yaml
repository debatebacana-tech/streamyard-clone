
# Appended to the generated egress.yaml at startup (see egress-config in
# docker-compose.yml), so tuning here reaches existing servers via git.
# Egress reserves 4 CPUs per web egress by default and rejects requests on a
# 2-vCPU VPS; one 720p30 stream fits in 2.
cpu_cost:
  web_cpu_cost: 2
  room_composite_cpu_cost: 2
